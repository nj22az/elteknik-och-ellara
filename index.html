<!DOCTYPE html>
<html lang=sv>
<head>
  <meta charset=utf-8>
  <meta name=viewport content="width=device-width, initial-scale=1">
  <title>Elteknik och ellära</title>
  <link rel=stylesheet href=site/style.css>
</head>
<body>
  <div id=gate class=gate hidden>
    <form class=gate-card id=gate-form>
      <p class=kicker>YH · Fartyg och automation</p>
      <h1>Elteknik och ellära</h1>
      <p class=sub>45 poäng. Lås upp kursmaterialet.</p>
      <label for=pw>Lösenord</label>
      <input id=pw name=password type=password autocomplete=current-password required>
      <button type=submit>Öppna</button>
      <p id=gate-err class=err hidden>Fel lösenord.</p>
    </form>
  </div>
  <div id=app hidden>
    <header class=top>
      <div class=top-row>
        <div class=brand>
          <p class=kicker>YH · 45 p</p>
          <h1><a href="#/" id=home-link>Elteknik och ellära</a></h1>
        </div>
        <nav class=top-nav id=top-nav aria-label=Huvudmeny>
          <a href="#/" data-nav=start>Start</a>
          <a href="#/kursen" data-nav=kursen>Kursen</a>
          <a href="#/bok" data-nav=bok>Boken</a>
          <a href="#/labbdag" data-nav=labbdag>Labbdag</a>
          <a href="#/prov" data-nav=prov>Prov</a>
          <button type=button class=ghost id=lock-btn>Lås</button>
        </nav>
      </div>
      <div id=course-bar class=course-bar hidden></div>
    </header>
    <main class=main id=main></main>
  </div>
  <script src=https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js></script>
  <script src=site/app.js></script>
</body>
</html>
